env:
  N: 200
  K: 3
  sigma: 0.2
  eta: 0.1
  max_steps: 60
  token_cost: 0.01

baselines:
  no_control:
    temperature_scale: 1.0
    listen_weight: 1.0
  spectral_heuristic:
    # scale listen weight w so lambda_max(w * B) <= margin * lambda_min(A)
    margin: 0.5
  lqr:
    Q: identity
    R: identity

rl:
  n_episodes: 200
  lr: 1.0e-3
  gamma: 0.99
  n_seeds: 5

stats:
  n_seeds: 10
  confidence: 0.95
